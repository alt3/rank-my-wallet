name: CI
on:
  push:
    branches:
    - main
    - update-packages/**
  pull_request:
    branches:
    - main

jobs:
  # Ensure correct code formatting
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Node v24
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - run: npm ci
    - run: npm run lint

  # Ensure typescript compiles
  typescript:
    name: Typescript
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Node v24
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - run: npm ci
    - run: npx tsc

  # Ensure all tests pass
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Node v24
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - run: npm ci
    - run: npm run test

  # Ensure the production build succeeds. Framework upgrades break here long
  # before they break lint or tests, so this job is the one that matters most.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Node v24
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - run: npm ci
    - run: npm run build
